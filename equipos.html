  <!DOCTYPE html>
  <html lang="es">
      <head>
          <meta charset="UTF-8" />
          <meta http-equiv="X-UA-Compatible" content="IE=edge" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Como la beisbol</title>
          <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
          <link rel="stylesheet" href="css/style.css">    
          <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
        </head>
      <body>


      <main class="page">
        <div id="header-container">
          <!-- El contenido del header se carga aquí mediante JavaScript asi creo que es mas facil de enteder, mas modular xd -->
        </div>
        

        <div class="contenedor-general"> <!--No se como ponerle la esctructura a este div xd-->
          <h2 class="titulo-interior">EQUIPOS</h2>
          
            <!-- selector de equipos -->
             <section class="selector-equipos">
                <h3 id="equipo-nombre" class="selector-nombre"></h3>
                <div class="selector-carrusel">
                  <button class="selector-flecha" id="equipo-prev" aria-label="Equipo anterior">&#10094;</button>
                  <div class="selector-logos">
                    <img id="logo-prev" class="logo-lateral" alt="">
                    <img id="logo-actual" class="logo-central" alt="">
                    <img id="logo-next" class="logo-lateral" alt="">
                  </div>
                  <button class="selector-flecha" id="equipo-next" aria-label="Equipo siguiente">&#10095;</button>
                </div>
                <div class="selector-puntos" id="equipo-puntos"></div>
              </section>

         <!-- Id para encontrar al equipo seleccionado-->
         <section id="equipo-info" class="equipo-info"></section>


        </div>
      </main>
      <script src="js/javascript.js"></script>
      </body>
  </html>
