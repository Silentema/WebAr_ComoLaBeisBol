    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const contenedor = document.getElementById("coleccion-gorras");

        let gorrasDesbloqueadas = [];

        try {
            gorrasDesbloqueadas = JSON.parse(
                localStorage.getItem("gorrasDesbloqueadas") || "[]"
            );
        } catch (error) {
            console.error("Error al cargar las gorras:", error);
        }

        if (!Array.isArray(gorrasDesbloqueadas) || gorrasDesbloqueadas.length === 0) {
            return;
        }

        contenedor.innerHTML = "";

        gorrasDesbloqueadas.forEach(ruta => {
            const modelo = document.createElement("model-viewer");

            modelo.setAttribute("data-src", ruta);
            modelo.setAttribute("loading", "lazy");
            modelo.setAttribute("camera-controls", "");
            modelo.setAttribute("auto-rotate", "");
            modelo.setAttribute("ar", "");
            modelo.setAttribute("ar-modes", "scene-viewer webxr quick-look");
            modelo.setAttribute("tone-mapping", "neutral");
            modelo.setAttribute("shadow-intensity", "1");
            modelo.classList.add("model-viewer");

            contenedor.appendChild(modelo);
            window.observarModeloEnVista(modelo);
        });
    });

    const contenedorFotos = document.getElementById("coleccion-imagenes");
    const urlsFotos = new Map();

    const mostrarFotos = async () => {
        try {
            const fotos = await window.coleccionFotosAR.listar();
            urlsFotos.forEach((url) => URL.revokeObjectURL(url));
            urlsFotos.clear();
            contenedorFotos.replaceChildren();

            if (fotos.length === 0) {
                contenedorFotos.innerHTML =
                    '<p class="collection-empty">Aún no has tomado fotos.</p>';
                return;
            }

            fotos.forEach((foto) => {
                const url = URL.createObjectURL(foto.imagen);
                urlsFotos.set(foto.id, url);

                const tarjeta = document.createElement("article");
                tarjeta.className = "photo-card";

                const imagen = document.createElement("img");
                imagen.src = url;
                imagen.alt = `Foto tomada el ${new Date(foto.fecha).toLocaleString()}`;

                const fecha = document.createElement("p");
                fecha.className = "photo-date";
                fecha.textContent = new Date(foto.fecha).toLocaleString();

                const acciones = document.createElement("div");
                acciones.className = "photo-actions";

                const descargar = document.createElement("a");
                descargar.className = "photo-action";
                descargar.href = url;
                descargar.download = `foto-ar-${foto.id}.jpg`;
                descargar.textContent = "Descargar";

                const eliminar = document.createElement("button");
                eliminar.className = "photo-action";
                eliminar.type = "button";
                eliminar.textContent = "Eliminar";
                eliminar.addEventListener("click", async () => {
                    eliminar.disabled = true;
                    try {
                        await window.coleccionFotosAR.eliminar(foto.id);
                        URL.revokeObjectURL(url);
                        urlsFotos.delete(foto.id);
                        tarjeta.remove();
                        if (!contenedorFotos.querySelector(".photo-card")) {
                            contenedorFotos.innerHTML =
                                '<p class="collection-empty">Aún no has tomado fotos.</p>';
                        }
                    } catch (error) {
                        console.error("No se pudo eliminar la foto.", error);
                        eliminar.disabled = false;
                    }
                });

                acciones.append(descargar, eliminar);
                tarjeta.append(imagen, fecha, acciones);
                contenedorFotos.appendChild(tarjeta);
            });
        } catch (error) {
            console.error("No se pudieron cargar las fotos guardadas.", error);
            contenedorFotos.innerHTML =
                '<p class="collection-empty">No se pudieron cargar tus fotos.</p>';
        }
    };

    mostrarFotos();
    </script>
