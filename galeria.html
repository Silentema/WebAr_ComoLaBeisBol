
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Como la beisbol - Galería</title>
    <script
        type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <div id="header-container">
        </div>
        <div class="contenedor-general">
            <h2 class="titulo-interior">GALERÍA</h2>
            <!-- SLIDER DE VIDEOS -->
            <div class="video-slider">
                <button id="anterior" type="button" aria-label="Video anterior">
                    ❮
                </button>
                <!-- Reproductor -->
                <div class="slider-contenido">
                    <video
                        id="video-actual"
                        controls
                        preload="none">
                    </video>
                        <div class="video-info">
                            <h3 id="titulo-video"></h3>
                            <p id="contador-video"></p>
                        </div>
                </div>
                <button id="siguiente" type="button" aria-label="Siguiente video">
                    ❯
                </button>
            </div>
        </div>
    </main>
    <script src="js/javascript.js"></script>

</body>
</html>
