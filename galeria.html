
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Como la beisbol - Galería</title>
    <script
        type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <div id="header-container">
        </div>
        <div class="contenedor-general">
            <h2 class="titulo-interior">GALERÍA</h2>
            <!-- SLIDER DE VIDEOS -->
            <div class="video-slider">
                <button id="anterior" type="button" aria-label="Video anterior">
                    ❮
                </button>
                <!-- Reproductor -->
                

<div class="slider-contenido">

    <!-- REPRODUCTOR -->
    <div class="video-marco" id="video-marco" data-filtro="ninguno">
        <video id="video-actual" controls preload="none"></video>
    </div>

    <!-- INFORMACIÓN -->
    <div class="video-info">

        <div class="video-encabezado">
            <p id="contador-video"></p>
            <h3 id="titulo-video"></h3>
        </div>

        <!-- TÍTULO DE FILTROS -->
        <h3 class="titulo-interior titulo-filtros">FILTROS</h3>

        <!-- BOTONES DE FILTROS -->
        <div class="filtros-galeria" role="group" aria-label="Filtros de video">

            <button type="button" class="filtro-btn activo"
                    data-filtro="ninguno" aria-pressed="true">
                <span class="filtro-preview">
                    <img src="assets/Videos/Baseball.WEBP" alt="">
                </span>
                <span class="filtro-nombre">Sin filtro</span>
            </button>

            <button type="button" class="filtro-btn"
                    data-filtro="pastel" aria-pressed="false">
                <span class="filtro-preview">
                    <img src="assets/Videos/Baseball.WEBP" alt="">
                </span>
                <span class="filtro-nombre">Pastel</span>
            </button>

            <button type="button" class="filtro-btn"
                    data-filtro="gaussiano" aria-pressed="false">
                <span class="filtro-preview">
                    <img src="assets/Videos/Baseball.WEBP" alt="">
                </span>
                <span class="filtro-nombre">Gaussiano</span>
            </button>

            <button type="button" class="filtro-btn"
                    data-filtro="cyberpunk" aria-pressed="false">
                <span class="filtro-preview">
                    <img src="assets/Videos/Baseball.WEBP" alt="">
                </span>
                <span class="filtro-nombre">Cyberpunk</span>
            </button>

            <button type="button" class="filtro-btn"
                    data-filtro="vhs" aria-pressed="false">
                <span class="filtro-preview">
                    <img src="assets/Videos/Baseball.WEBP" alt="">
                </span>
                <span class="filtro-nombre">VHS</span>
            </button>

            <button type="button" class="filtro-btn"
                    data-filtro="glitch" aria-pressed="false">
                <span class="filtro-preview">
                    <img src="assets/Videos/Baseball.WEBP" alt="">
                </span>
                <span class="filtro-nombre">Glitch RGB</span>
            </button>

            <button type="button" class="filtro-btn"
                    data-filtro="comic" aria-pressed="false">
                <span class="filtro-preview">
                    <img src="assets/Videos/Baseball.WEBP" alt="">
                </span>
                <span class="filtro-nombre">Cómic impreso</span>
            </button>
        </div>
    </div>
</div>

                <button id="siguiente" type="button" aria-label="Siguiente video">
                    ❯
                </button>
            </div>
        </div>
    </main>
    <script src="js/javascript.js"></script>

</body>
</html>
