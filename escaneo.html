
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #scan-progress {
        position: fixed;
        z-index: 10;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: min(360px, calc(100vw - 40px));
        padding: 14px 18px;
        border-radius: 8px;
        background: rgba(31, 83, 78, 0.94);
        color: #fff;
        font: 600 15px Arial, sans-serif;
        box-sizing: border-box;
      }

      #scan-progress-label {
        display: block;
        margin-bottom: 9px;
        text-align: center;
      }

      #scan-progress-track {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.3);
      }

      #scan-progress-bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #fff;
        transition: width 0.08s linear;
      }

      #capture-photo-button {
        position: fixed;
        z-index: 20;
        bottom: 112px;
        left: 50%;
        transform: translateX(-50%);
        min-height: 48px;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #1f534e;
        font: 700 16px Arial, sans-serif;
        cursor: pointer;
      }

      #capture-photo-button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      #capture-photo-status {
        position: fixed;
        z-index: 20;
        right: 12px;
        bottom: 168px;
        left: 12px;
        color: #fff;
        font: 600 14px Arial, sans-serif;
        text-align: center;
        text-shadow: 0 1px 3px #000;
      }

      #model-viewer {
        position: fixed;
        z-index: 30;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        background-color: #f4f4f4;
      }

      #model-viewer[hidden] {
        display: none;
      }

      #post-prize-actions {
        position: fixed;
        z-index: 50;
        right: 0;
        bottom: max(24px, env(safe-area-inset-bottom));
        left: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 0 16px;
      }

      #post-prize-actions[hidden] {
        display: none;
      }

      .post-prize-button {
        min-height: 48px;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #1f534e;
        color: #fff;
        font: 600 15px Arial, sans-serif;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }

      #prize-transition {
        position: fixed;
        z-index: 40;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(31, 83, 78, 0.96);
        color: #fff;
        animation: prize-fade 1.6s ease both;
      }

      #prize-transition[hidden] {
        display: none;
      }

      .prize-message {
        z-index: 1;
        width: min(100%, 420px);
        padding: 28px 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 16px;
        background: #1f534e;
        color: #fff;
        text-align: center;
        animation: message-fade 1.6s ease both;
      }

      .prize-message span {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        place-items: center;
        border: 3px solid #fff;
        border-radius: 50%;
        font: 700 36px/1 Arial, sans-serif;
      }

      .prize-message h1 {
        margin: 0;
        font: 800 clamp(30px, 8vw, 54px)/1.1 Arial, sans-serif;
      }

      .prize-message p {
        margin: 12px 0 0;
        font: 600 18px Arial, sans-serif;
      }

      @keyframes prize-fade {
        0%, 10% { opacity: 0; }
        20%, 75% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes message-fade {
        0%, 15% { opacity: 0; }
        25%, 75% { opacity: 1; }
        100% { opacity: 0; }
      }

      .model-reveal {
        animation: model-fade 0.5s ease-out both;
      }

      @keyframes model-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #prize-transition,
        .prize-message,
        .model-reveal {
          animation: none;
        }

        #prize-transition,
        .prize-message {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="scan-progress" role="status">
      <span id="scan-progress-label">Enfoca una imagen para abrir el sobre</span>
      <div id="scan-progress-track"
           role="progressbar"
           aria-label="Progreso de la animación del sobre"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0">
        <div id="scan-progress-bar"></div>
      </div>
    </div>
    <button id="capture-photo-button" type="button" hidden>Tomar foto</button>
    <p id="capture-photo-status" role="status" aria-live="polite" hidden></p>

    <a-scene mindar-image="imageTargetSrc: assets/targets(Todos).mind;"
         color-space="sRGB"
         renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
         vr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity light="type: ambient; color: #ffffff; intensity: 50.2"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 50.1"
                position="1 2 1"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.5"
                position="-1 0.5 -1"></a-entity>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 5">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 6">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 7">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 8">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 9">
        <a-gltf-model src="assets/SobreAnimNuevo.glb"
                      position="0 0 0.1" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
      </a-entity>

    </a-scene>

    <model-viewer id="model-viewer"
                  src="assets/Animacioncarta1Veracruz.glb"
                  camera-controls
                  tone-mapping="neutral"
                  shadow-intensity="1"
                  autoplay
                  hidden>
      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>
    </model-viewer>

    <div id="post-prize-actions" hidden>
      <a class="post-prize-button" href="index.html">Regresar a menú</a>
      <a class="post-prize-button" href="AR.html">Colección de cartas</a>
    </div>

    <div id="prize-transition" aria-live="polite" hidden>
      <div class="prize-message">
        <span aria-hidden="true">✓</span>
        <h1>¡Nueva carta desbloqueada!</h1>
        <p>Ya está disponible en tu colección.</p>
      </div>
    </div>

    <script src="js/fotos-ar.js"></script>
    <script>
      console.log(
        " prefers-reduced-motion activado:",
        matchMedia("(prefers-reduced-motion: reduce)").matches
      );

      const scanScene = document.querySelector("a-scene[mindar-image]");
      const modelViewer = document.querySelector("#model-viewer");
      const prizeTransition = document.querySelector("#prize-transition");
      const progressLabel = document.querySelector("#scan-progress-label");
      const progressTrack = document.querySelector("#scan-progress-track");
      const progressBar = document.querySelector("#scan-progress-bar");
      const capturePhotoButton = document.querySelector("#capture-photo-button");
      const capturePhotoStatus = document.querySelector("#capture-photo-status");
      const envelopeAnimationSpeed = 1.0;
      scanScene.addEventListener("arReady", () => {
        capturePhotoButton.hidden = false;
        capturePhotoStatus.hidden = false;
      });
      const cartasPorTarget = {
        0: "assets/Animacioncarta1Veracruz.glb",
        1: "assets/Animacioncarta2Leon.glb",
        2: "assets/Animacioncarta3Queretaro.glb",
        3: "assets/Animacioncarta4CiudadDeMexico.glb",
        4: "assets/Animacioncarta5Guerrero.glb",
        5: "assets/Animacioncarta6Yucatan.glb",
        6: "assets/Animacioncarta7Tabasco.glb",
        7: "assets/Animacioncarta8Puebla.glb",
        8: "assets/Animacioncarta9Campeche.glb",
        9: "assets/Animacioncarta10Qroo.glb"
      };
      let scanSucceeded = false;
      let transitionFinished = false;
      let animationStarted = false;
      let animationFinished = false;
      let targetVisible = false;
      let activeTarget = null;
      let animationDuration = 0;
      let animationElapsed = 0;
      let animationRunStartedAt = null;
      let animationFrame;

      const createPhotoBlob = () => {
        const mindarSystem = scanScene.systems["mindar-image-system"];
        const video = mindarSystem?.video;
        const rendererCanvas = scanScene.canvas;
        const screenshot = scanScene.components.screenshot;

        if (!video || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
            !rendererCanvas || !rendererCanvas.width || !rendererCanvas.height ||
            !screenshot) {
          throw new Error("La cámara o la escena AR todavía no están listas.");
        }

        scanScene.setAttribute("screenshot", {
          width: rendererCanvas.width,
          height: rendererCanvas.height
        });
        const arCanvas = scanScene.components.screenshot.getCanvas("perspective");
        const photoCanvas = document.createElement("canvas");
        photoCanvas.width = rendererCanvas.width;
        photoCanvas.height = rendererCanvas.height;
        const context = photoCanvas.getContext("2d");
        if (!context) {
          throw new Error("No se pudo preparar la imagen.");
        }

        const sourceAspect = video.videoWidth / video.videoHeight;
        const outputAspect = photoCanvas.width / photoCanvas.height;
        let sourceX = 0;
        let sourceY = 0;
        let sourceWidth = video.videoWidth;
        let sourceHeight = video.videoHeight;

        if (sourceAspect > outputAspect) {
          sourceWidth = video.videoHeight * outputAspect;
          sourceX = (video.videoWidth - sourceWidth) / 2;
        } else {
          sourceHeight = video.videoWidth / outputAspect;
          sourceY = (video.videoHeight - sourceHeight) / 2;
        }

        context.drawImage(
          video,
          sourceX, sourceY, sourceWidth, sourceHeight,
          0, 0, photoCanvas.width, photoCanvas.height
        );
        context.drawImage(arCanvas, 0, 0, photoCanvas.width, photoCanvas.height);

        return new Promise((resolve, reject) => {
          photoCanvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("El navegador no pudo generar la foto."));
            }
          }, "image/jpeg", 0.9);
        });
      };

      capturePhotoButton.addEventListener("click", async () => {
        capturePhotoButton.disabled = true;
        capturePhotoStatus.textContent = "Guardando foto...";

        try {
          const photo = await createPhotoBlob();
          await window.coleccionFotosAR.guardar(photo);
          capturePhotoStatus.textContent = "Foto guardada en AR > Imágenes";
        } catch (error) {
          console.error("No se pudo capturar o guardar la foto.", error);
          capturePhotoStatus.textContent = "No se pudo guardar la foto. Inténtalo de nuevo.";
        } finally {
          capturePhotoButton.disabled = false;
        }
      });

      const finishPrizeTransition = () => {
        if (transitionFinished) {
          return;
        }

        transitionFinished = true;
        prizeTransition.hidden = true;
        modelViewer.hidden = false;
        modelViewer.classList.add("model-reveal");
        document.querySelector("#post-prize-actions").hidden = false;
      };

      const updateProgress = (now) => {
        if (animationRunStartedAt === null || animationFinished) {
          return;
        }

        const elapsed = animationElapsed + (now - animationRunStartedAt);
        const progress = Math.min(elapsed / (animationDuration * 1000), 0.99);
        const percentage = Math.floor(progress * 100);
        progressBar.style.width = `${percentage}%`;
        progressTrack.setAttribute("aria-valuenow", String(percentage));

        if (percentage < 99) {
          animationFrame = requestAnimationFrame(updateProgress);
        }
      };

      const pauseEnvelopeAnimation = (modelElement) => {
        if (!animationStarted || animationFinished || animationRunStartedAt === null) {
          return;
        }

        animationElapsed += performance.now() - animationRunStartedAt;
        animationRunStartedAt = null;
        cancelAnimationFrame(animationFrame);
        modelElement.setAttribute("animation-mixer", "timeScale", 0);
      };

      const resumeEnvelopeAnimation = (modelElement) => {
        if (!animationStarted || animationFinished || !targetVisible || animationRunStartedAt !== null) {
          return;
        }

        animationRunStartedAt = performance.now();
        modelElement.setAttribute("animation-mixer", "timeScale", envelopeAnimationSpeed);
        animationFrame = requestAnimationFrame(updateProgress);
      };

      const showPrize = () => {
        const mindarSystem = scanScene.systems["mindar-image-system"];
        if (!mindarSystem) {
          console.error("No se encontró el sistema MindAR para detener la cámara.");
          return;
        }

        const cameraStream = mindarSystem.video?.srcObject;
        try {
          mindarSystem.stop();
        } catch (error) {
          console.error("MindAR no pudo completar el cierre normal de la cámara.", error);
        } finally {
          cameraStream?.getTracks().forEach((track) => track.stop());
          mindarSystem.ui?.scanningMask?.classList.add("hidden");
          mindarSystem.video?.remove();
          capturePhotoButton.hidden = true;
          capturePhotoStatus.hidden = true;
          scanScene.style.display = "none";
          document.querySelector("#scan-progress").hidden = true;
          prizeTransition.hidden = false;
          window.setTimeout(finishPrizeTransition, 1600);
        }
      };

      const startEnvelopeAnimation = (modelElement) => {
        if (animationStarted) {
          return;
        }

        const model = modelElement.getObject3D("mesh");
        const clips = model?.animations;
        if (!clips?.length) {
          console.error("El modelo del sobre no contiene animaciones.");
          progressLabel.textContent = "No se pudo cargar la animación del sobre";
          return;
        }

        animationStarted = true;
        animationDuration = Math.max(...clips.map((clip) => clip.duration)) / envelopeAnimationSpeed;
        const finishedClips = new Set();

        modelElement.addEventListener("animation-finished", (event) => {
          finishedClips.add(event.detail.action.getClip());
          if (finishedClips.size === clips.length) {
            animationFinished = true;
            animationRunStartedAt = null;
            cancelAnimationFrame(animationFrame);
            progressBar.style.width = "100%";
            progressTrack.setAttribute("aria-valuenow", "100");
            showPrize();
          }
        });

        modelElement.setAttribute(
          "animation-mixer",
          "clip: *; loop: once; timeScale: 0"
        );
        progressLabel.textContent = "Abriendo sobre...";
        resumeEnvelopeAnimation(modelElement);
      };

      document.querySelectorAll("[mindar-image-target]").forEach((target) => {
        target.addEventListener("targetFound", () => {
          if (scanSucceeded && target !== activeTarget) {
            return;
          }

          targetVisible = true;
          if (scanSucceeded) {
            const modelElement = target.querySelector("a-gltf-model");
            progressLabel.textContent = "Abriendo sobre...";
            resumeEnvelopeAnimation(modelElement);
            return;
          }

          const targetIndex = Number(
            target.getAttribute("mindar-image-target").targetIndex
          );
          const cartaSrc = cartasPorTarget[targetIndex];
          console.info(`Logo detectado: targetIndex ${targetIndex}`);

          if (!cartaSrc) {
            console.error(
              `No hay una carta configurada para targetIndex ${targetIndex}. Agrégala en cartasPorTarget.`
            );
            progressLabel.textContent = `Falta configurar la carta para el índice ${targetIndex}`;
            return;
          }

          try {
            localStorage.setItem(`cartaDesbloqueada:${cartaSrc}`, "true");
          } catch (error) {
            console.error("No se pudo guardar la carta desbloqueada.", error);
            progressLabel.textContent = "No se pudo guardar la carta en este dispositivo";
            return;
          }

          scanSucceeded = true;
          activeTarget = target;
          modelViewer.src = cartaSrc;
          const modelElement = target.querySelector("a-gltf-model");
          modelElement.addEventListener("model-loaded", () => {
            startEnvelopeAnimation(modelElement);
          }, { once: true });

          if (modelElement.getObject3D("mesh")) {
            startEnvelopeAnimation(modelElement);
          }
        });

        target.addEventListener("targetLost", () => {
          if (target !== activeTarget || animationFinished) {
            return;
          }

          targetVisible = false;
          pauseEnvelopeAnimation(target.querySelector("a-gltf-model"));
          progressLabel.textContent = "Apunta de nuevo al logo para continuar";
        });
      });

    </script>
  </body>
</html>
